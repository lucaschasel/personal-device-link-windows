[package]
name = "personal-device-link"
default-run = "personal-device-link"
version = "0.15.1"
edition = "2021"
description = "Local network device link — discovery, bidirectional input control and file transfer"
publish = false
license = "MIT"

[dependencies]
mdns-sd = "0.21.5"
ctrlc = "3.5"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
arboard = "3.6.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Devices_Bluetooth", "Win32_Networking_WinSock"] }
