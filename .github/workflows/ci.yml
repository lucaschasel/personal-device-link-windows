name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run desktop:build -- --no-bundle -- --locked
        working-directory: desktop
        if: runner.os == 'Windows'
      - run: cargo build --locked --release --bin bluetooth_bridge
        if: runner.os == 'Windows'
      - run: ./scripts/Package-Desktop.ps1
        if: runner.os == 'Windows'
      - run: bash scripts/package-macos.sh test
        if: runner.os == 'macOS'
      - uses: actions/upload-artifact@v4
        with:
          name: personal-device-link-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
